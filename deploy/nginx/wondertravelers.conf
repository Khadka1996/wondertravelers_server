# /etc/nginx/sites-available/wondertravelers.conf
# www.wondertravelers.com is the canonical host: everything else redirects there.
# Visitor IPs behind Cloudflare: /etc/nginx/conf.d/cloudflare-realip.conf.

upstream wt_web { server 127.0.0.1:3000; keepalive 32; }
upstream wt_api { server 127.0.0.1:5000; keepalive 32; }

# http -> https (certbot answers its own challenges before this redirect)
server {
    listen 80;
    listen [::]:80;
    server_name wondertravelers.com www.wondertravelers.com api.wondertravelers.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# bare domain -> www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wondertravelers.com;
    ssl_certificate /etc/letsencrypt/live/wondertravelers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wondertravelers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.wondertravelers.com$request_uri;
}

# Website (Next.js). /api and /uploads are passed on to the API by Next itself.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wondertravelers.com;
    ssl_certificate /etc/letsencrypt/live/wondertravelers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wondertravelers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Safety net: a redirect built from Next's own address must not leak out.
    proxy_redirect http://localhost:3000/ /;
    proxy_redirect https://localhost:3000/ /;

    # Build assets have content hashes in their names: cache for a year.
    location /_next/static/ {
        proxy_pass http://wt_web;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded images: straight from disk, no Node involved.
    location /uploads/ {
        alias /srv/app/shared/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://wt_web;
    }
}

# API for outside callers (payment providers, email links). The website
# itself talks to the API on 127.0.0.1.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wondertravelers.com;
    ssl_certificate /etc/letsencrypt/live/api.wondertravelers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wondertravelers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://wt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
